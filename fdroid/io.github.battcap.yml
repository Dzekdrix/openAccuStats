# Modèle de fiche pour le dépôt fdroiddata (https://gitlab.com/fdroid/fdroiddata).
# À copier dans metadata/io.github.battcap.yml lors de la merge request d'inclusion.
# Remplacez VOTRE_COMPTE par l'adresse réelle du dépôt.
Categories:
  - System
License: GPL-3.0-or-later
AuthorName: VOTRE_NOM
SourceCode: https://github.com/VOTRE_COMPTE/BattCap
IssueTracker: https://github.com/VOTRE_COMPTE/BattCap/issues
Changelog: https://github.com/VOTRE_COMPTE/BattCap/blob/HEAD/CHANGELOG.md

AutoName: BattCap

RepoType: git
Repo: https://github.com/VOTRE_COMPTE/BattCap.git

Builds:
  - versionName: 0.1.0
    versionCode: 100
    commit: v0.1.0
    subdir: app
    gradle:
      - yes

# F-Droid détecte chaque nouveau tag vX.Y.Z, lit versionCode/versionName
# dans app/build.gradle.kts et ajoute automatiquement le build correspondant.
AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 100
