# Intégration continue (facultative) : compile et teste à chaque push et pull request.
# Uniquement des actions open source ; n'affecte pas le build réalisé par F-Droid.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires et build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
